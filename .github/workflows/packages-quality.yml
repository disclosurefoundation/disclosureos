name: Packages Quality

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/rfcs/**"
      - "docs/c1/**"
      - "docs/c2/**"
      - "docs/releases/**"
      - "docs/release-process.md"
      - ".changeset/**"
      - "conformance/**"
      - "scripts/**"
      - ".github/workflows/packages-quality.yml"
      - "packages/**"
      - "examples/**"
      - "turbo.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "docs/rfcs/**"
      - "docs/c1/**"
      - "docs/c2/**"
      - "docs/releases/**"
      - "docs/release-process.md"
      - ".changeset/**"
      - "conformance/**"
      - "scripts/**"
      - ".github/workflows/packages-quality.yml"
      - "packages/**"
      - "examples/**"
      - "turbo.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: packages-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@disclosureos/records"
          - "@disclosureos/observables"
          - "@disclosureos/origins"
          - "@disclosureos/instruments"
          - "@disclosureos/scoring"
          - "@disclosureos/schema"
          - "@disclosureos/cli"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package (+ workspace deps)
        run: pnpm --filter "${{ matrix.package }}..." build

      - name: Type check
        run: pnpm --filter ${{ matrix.package }} --if-present run type-check

      - name: Unit + schema-drift tests
        run: pnpm --filter ${{ matrix.package }} --if-present run test run

      - name: Publish-correctness gate (publint + attw)
        run: pnpm --filter ${{ matrix.package }} run lint:publish

      - name: npm pack dry-run
        run: pnpm --filter ${{ matrix.package }} exec npm pack --dry-run

  examples:
    name: Examples golden path
    runs-on: ubuntu-latest
    needs: foundation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build foundation packages
        run: pnpm --filter "@disclosureos/examples..." build

      - name: Type check examples
        run: pnpm --filter @disclosureos/examples type-check

      - name: Run golden path
        run: pnpm --filter @disclosureos/examples golden-path

      - name: Build CLI
        run: pnpm --filter "@disclosureos/cli..." build

      - name: Validate sensor manifests
        run: node packages/disclosureos-cli/dist/index.js manifest validate examples/manifests/eldaeon-sensors.json

  conformance-baseline:
    name: V1 baseline and partner audit (not v2 certification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@disclosureos/cli..." build
      - run: pnpm conformance:baseline
      - run: pnpm conformance:matrix
      - run: pnpm test:conformance
      - run: pnpm test:v2-primitives
      - run: pnpm test:v2-observation
      - run: pnpm test:v2-claims
      - run: pnpm test:v2-documentation
      - run: pnpm test:v2-acquisition
      - run: pnpm test:v2-bindings
      - run: pnpm test:v2-measurements
      - run: pnpm test:v2-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm test:v2-packet
      - run: pnpm test:v2-packet-cli
      - run: pnpm test:v2-dataset
      - run: pnpm test:v2-intake
      - run: pnpm test:population-coverage
      - run: pnpm test:v2-summary
      - run: pnpm test:v2-completion
      - run: pnpm test:v2-research-completion
      - run: pnpm test:v2-evaluation
      - run: pnpm test:v2-replay
      - run: pnpm test:v2-summary-evaluation
      - run: pnpm test:v2-released-documents
      - run: pnpm test:v2-testimony
      - run: pnpm test:v2-physical-samples
      - run: pnpm test:v2-profile-evaluation
      - run: pnpm test:v2-profile-cli
      - run: pnpm test:v2-profile-preparation
      - run: pnpm test:v2-migration-dry-run
      - run: pnpm test:v2-migration-review
      - run: pnpm test:v2-migration-export
      - run: pnpm test:v2-migration-ledger
      - run: pnpm test:v2-migration-resolution
      - run: pnpm test:v2-migration-apply
      - run: pnpm test:v2-migration-read-path
      - run: pnpm test:v2-migration-legacy-scores
      - run: pnpm test:v2-migration-compatibility
      - run: pnpm test:v2-migration-closeout
      - run: pnpm test:partner-audit
      - run: pnpm test:partner-mapping

  beta-consumer:
    name: Beta tarballs and isolated consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm release:pack "${{ runner.temp }}/disclosureos-beta"
      - uses: actions/upload-artifact@v4
        with:
          name: disclosureos-beta-candidate
          path: |
            ${{ runner.temp }}/disclosureos-beta/release-manifest.json
            ${{ runner.temp }}/disclosureos-beta/artifacts/*.tgz
          if-no-files-found: error

  context:
    name: C1 context and snapshot references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@disclosureos/schema..." build
      - run: pnpm test:v2-context
      - run: python3 scripts/check-c1-mapping.py

  research-entities:
    name: C2 witnesses and accounts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@disclosureos/schema..." build
      - run: pnpm test:v2-entities
      - run: python3 scripts/check-c2-witness-mapping.py
